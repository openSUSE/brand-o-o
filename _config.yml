lang: en
title: openSUSE Brand
title_short: Brand
description: Resources for the openSUSE brand
copyright: '© 2025 openSUSE contributors'
baseurl: ""
url: "https://brand.opensuse.org"
github_url: "https://github.com/openSUSE/brand-o-o"

navbar_links:
  -
    link: https://www.opensuse.org/
